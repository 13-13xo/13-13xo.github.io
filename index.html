<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Games</title>
<style>
  :root {
    --seam: 26px;
    --ink: #080a0d;

    --steel-hi:  #f6f9fc;
    --steel-lit: #d7dee6;
    --steel-mid: #a3adb9;
    --steel-dk:  #626c78;
    --steel-deep:#333b44;

    --bronze-hi:  #ffd9a1;
    --bronze-lit: #e7a256;
    --bronze-mid: #bb6c25;
    --bronze-dk:  #7d3f0f;
    --bronze-deep:#3f1f06;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    display: flex;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  /* moody vignette over everything */
  .stage::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 6;
    pointer-events: none;
    background:
      radial-gradient(130% 110% at 50% 45%, transparent 48%, rgba(0,0,0,.5) 100%);
  }

  .side {
    position: relative;
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 7vh 6vw;
    overflow: hidden;
    isolation: isolate;
  }

  /* brushed-metal grain */
  .side::before {
    content: "";
    position: absolute; inset: 0;
    z-index: -2;
    opacity: .38;
    background-image:
      repeating-linear-gradient(112deg,
        rgba(255,255,255,.22) 0 1px,
        rgba(0,0,0,.12) 1px 2px,
        transparent 2px 6px);
    mix-blend-mode: overlay;
  }

  /* specular sheen streak */
  .side::after {
    content: "";
    position: absolute; inset: -20%;
    z-index: -1;
    background: linear-gradient(78deg,
      transparent 32%,
      rgba(255,255,255,.30) 45%,
      rgba(255,255,255,.06) 52%,
      transparent 62%);
    pointer-events: none;
  }

  /* ---------- HIS: brushed steel ---------- */
  .his {
    background:
      radial-gradient(110% 85% at 12% 8%, rgba(255,255,255,.92), transparent 52%),
      radial-gradient(95% 75% at 92% 96%, rgba(255,255,255,.30), transparent 58%),
      linear-gradient(137deg,
        var(--steel-hi) 0%,
        var(--steel-lit) 20%,
        #e9eef3 33%,
        var(--steel-mid) 54%,
        #cfd7df 64%,
        var(--steel-dk) 82%,
        var(--steel-deep) 100%);
    color: #0e1319;
  }

  /* ---------- HER: cast bronze ---------- */
  .her {
    background:
      radial-gradient(110% 85% at 88% 8%, rgba(255,214,155,.85), transparent 52%),
      radial-gradient(95% 75% at 8% 96%, rgba(255,150,60,.40), transparent 58%),
      linear-gradient(137deg,
        var(--bronze-hi) 0%,
        var(--bronze-lit) 20%,
        #f0b878 32%,
        var(--bronze-mid) 52%,
        #d08536 63%,
        var(--bronze-dk) 82%,
        var(--bronze-deep) 100%);
    color: #2a1305;
  }

  .content {
    position: relative;
    max-width: 30ch;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) 2.15s both;
  }

  .her .content { margin-left: auto; text-align: right; }

  .eyebrow {
    display: inline-block;
    font-size: .7rem;
    letter-spacing: .34em;
    text-transform: uppercase;
    font-weight: 700;
    padding: .42em .72em;
    border: 1px solid currentColor;
    border-radius: 2px;
    opacity: .62;
    margin-bottom: 1.1rem;
  }

  h1 {
    margin: 0 0 .55rem;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    font-size: clamp(2.8rem, 7.4vw, 5.8rem);
    line-height: .9;
    letter-spacing: .012em;
    text-transform: uppercase;
  }

  .his h1 {
    color: #151c24;
    text-shadow:
      0 2px 0 rgba(255,255,255,.95),
      0 -1px 0 rgba(0,0,0,.35),
      0 8px 22px rgba(0,0,0,.22);
  }

  .her h1 {
    color: #331704;
    text-shadow:
      0 2px 0 rgba(255,226,183,.9),
      0 -1px 0 rgba(0,0,0,.35),
      0 8px 22px rgba(0,0,0,.25);
  }

  .sub {
    margin: 0 0 2rem;
    font-size: .95rem;
    opacity: .7;
    letter-spacing: .02em;
  }

  .games { display: grid; gap: .8rem; }

  /* riveted metal plate */
  .plate {
    position: relative;
    display: block;
    padding: 1.05rem 1.2rem;
    text-decoration: none;
    color: inherit;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.38);
    background: linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.10) 60%, rgba(0,0,0,.10));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -1px 0 rgba(0,0,0,.28),
      0 8px 22px rgba(0,0,0,.28);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .her .plate {
    background: linear-gradient(180deg, rgba(255,238,208,.6), rgba(255,200,140,.18) 60%, rgba(80,36,8,.18));
  }

  .plate:hover, .plate:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(0,0,0,.65);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 14px 30px rgba(0,0,0,.38);
    outline: none;
  }

  .plate::before, .plate::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 7px; height: 7px;
    margin-top: -3.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #8e959e 55%, #3a4047);
    box-shadow: 0 1px 1px rgba(0,0,0,.55);
  }
  .plate::before { left: 7px; }
  .plate::after  { right: 7px; }

  .plate strong {
    display: block;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    font-size: 1.4rem;
    letter-spacing: .035em;
    text-transform: uppercase;
    padding: 0 .95rem;
  }

  .plate span {
    display: block;
    font-size: .84rem;
    opacity: .75;
    padding: 0 .95rem;
  }

  .plate .size { font-size: .74rem; opacity: .55; margin-top: .35rem; }

  .empty {
    padding: 1.15rem 1.2rem;
    border: 1px dashed rgba(0,0,0,.42);
    border-radius: 3px;
    font-size: .88rem;
    opacity: .68;
    letter-spacing: .02em;
  }

  /* ---------- weld seam ---------- */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: var(--seam);
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    animation: seamIn .3s ease-out .95s both;
  }

  /* soft heat bloom behind the bead */
  .seam::before {
    content: "";
    position: absolute;
    top: -2%; bottom: -2%;
    left: 50%;
    width: 190px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side,
      rgba(255,150,45,.55) 0%,
      rgba(255,110,20,.30) 38%,
      rgba(255,80,0,.12) 62%,
      transparent 78%);
    filter: blur(18px);
    animation: bloom 2.6s ease-out 2.0s both;
  }

  .bead {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    filter: url(#molten) saturate(1.12);
    background:
      repeating-linear-gradient(183deg,
        rgba(255,248,220,.55) 0 1.5px,
        rgba(120,45,5,.30) 1.5px 3px,
        transparent 3px 7px),
      repeating-linear-gradient(-24deg,
        rgba(255,235,200,.16) 0 2px,
        transparent 2px 6px),
      linear-gradient(180deg,
        #ffdfae 0%,
        #ffb768 14%,
        #ff8a2b 34%,
        #e85b0c 50%,
        #a53402 68%,
        #ff9536 86%,
        #ffe4bd 100%);
    box-shadow:
      0 0 10px rgba(255,170,70,.9),
      0 0 26px rgba(255,110,20,.65),
      0 0 60px rgba(255,70,0,.4),
      inset 0 0 10px rgba(90,28,0,.6),
      inset 1px 0 0 rgba(255,245,220,.35),
      inset -1px 0 0 rgba(90,30,0,.45);
    animation: beadSettle 2.2s ease-out 2.05s both;
  }

  /* travelling arc */
  .arc {
    position: absolute;
    left: 50%;
    width: 88px; height: 88px;
    margin-left: -44px; margin-top: -44px;
    border-radius: 50%;
    background: radial-gradient(circle,
      #fff 0%,
      #fffdf2 12%,
      #ffe6a8 24%,
      #ffc061 38%,
      rgba(255,120,20,.6) 55%,
      transparent 72%);
    filter: blur(.5px);
    opacity: 0;
    animation: arcRun 1.15s cubic-bezier(.4,0,.6,1) 1.0s both;
  }

  .sparks { position: absolute; inset: 0; overflow: visible; }

  .spark {
    position: absolute;
    left: 50%; top: 0;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff6d2;
    box-shadow: 0 0 7px 2px rgba(255,170,60,.95);
    opacity: 0;
    animation: sparkFly .62s ease-out both;
    animation-delay: calc(1.0s + var(--d));
  }

  /* ---------- keyframes ---------- */
  @keyframes slideFromLeft  { from { transform: translateX(-102%); } to { transform: none; } }
  @keyframes slideFromRight { from { transform: translateX(102%);  } to { transform: none; } }
  @keyframes slideFromTop   { from { transform: translateY(-102%); } to { transform: none; } }
  @keyframes slideFromBottom{ from { transform: translateY(102%);  } to { transform: none; } }

  .his { animation: slideFromLeft  .95s cubic-bezier(.16,.84,.24,1) both; }
  .her { animation: slideFromRight .95s cubic-bezier(.16,.84,.24,1) both; }

  @keyframes seamIn { from { opacity: 0; } to { opacity: 1; } }

  @keyframes bloom {
    0%   { opacity: .25; filter: blur(10px); }
    30%  { opacity: 1;   filter: blur(22px); }
    100% { opacity: .55; filter: blur(18px); }
  }

  @keyframes arcRun {
    0%   { top: 0%;   opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  @keyframes sparkFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.25); }
  }

  @keyframes beadSettle {
    0%   { filter: url(#molten) brightness(2.5) saturate(1.5); }
    100% { filter: url(#molten) brightness(1) saturate(1.12); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- skip / reduced motion ---------- */
  body.done .side,
  body.done .seam,
  body.done .seam::before,
  body.done .bead,
  body.done .arc,
  body.done .spark,
  body.done .content { animation: none !important; }

  body.done .arc, body.done .spark { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .side, .seam, .seam::before, .bead, .arc, .spark, .content { animation: none !important; }
    .arc, .spark { display: none; }
  }

  /* ---------- mobile: stack, horizontal seam ---------- */
  @media (max-width: 820px) {
    .stage { flex-direction: column; }

    .side { padding: 5.5vh 7vw; justify-content: center; }
    .content { max-width: none; }
    .her .content { margin-left: 0; text-align: left; }
    h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); }

    .seam {
      top: 50%; bottom: auto;
      left: 0; right: 0;
      width: auto;
      height: var(--seam);
      transform: translateY(-50%);
    }

    .seam::before {
      top: 50%; bottom: auto;
      left: -2%; right: -2%;
      width: auto;
      height: 150px;
      transform: translateY(-50%);
    }

    .bead {
      background:
        repeating-linear-gradient(93deg,
          rgba(255,248,220,.55) 0 1.5px,
          rgba(120,45,5,.30) 1.5px 3px,
          transparent 3px 7px),
        repeating-linear-gradient(-24deg,
          rgba(255,235,200,.16) 0 2px,
          transparent 2px 6px),
        linear-gradient(90deg,
          #ffdfae 0%, #ffb768 14%, #ff8a2b 34%,
          #e85b0c 50%, #a53402 68%, #ff9536 86%, #ffe4bd 100%);
    }

    .arc { animation-name: arcRunH; }
    .his { animation-name: slideFromTop; }
    .her { animation-name: slideFromBottom; }
  }

  @keyframes arcRunH {
    0%   { left: 0%;   opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="molten">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.11" numOctaves="2" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<main class="stage">
  <section class="side his" aria-labelledby="his-title">
    <div class="content">
      <span class="eyebrow">Side A &middot; Steel</span>
      <h1 id="his-title">His Games</h1>
      <p class="sub">Cold-rolled, riveted, ready to fire.</p>

      <div class="games">
        <a class="plate" href="shoot-the-shit/">
          <strong>Shoot The Shit</strong>
          <span>Ten missions, three sectors. Siege and demolition.</span>
          <span class="size">86 MB &middot; give it a moment to load</span>
        </a>
      </div>
    </div>
  </section>

  <section class="side her" aria-labelledby="her-title">
    <div class="content">
      <span class="eyebrow">Side B &middot; Bronze</span>
      <h1 id="her-title">Her Games</h1>
      <p class="sub">Cast, polished, still cooling.</p>

      <div class="games">
        <div class="empty">Nothing welded in yet.</div>
      </div>
    </div>
  </section>

  <div class="seam" aria-hidden="true">
    <div class="bead"></div>
    <div class="arc"></div>
    <div class="sparks">
      <i class="spark" style="--d:.05s; --x:-46px; --y:38px"></i>
      <i class="spark" style="--d:.12s; --x:52px;  --y:26px"></i>
      <i class="spark" style="--d:.18s; --x:-30px; --y:-34px"></i>
      <i class="spark" style="--d:.24s; --x:38px;  --y:-42px"></i>
      <i class="spark" style="--d:.30s; --x:-58px; --y:12px"></i>
      <i class="spark" style="--d:.36s; --x:60px;  --y:44px"></i>
      <i class="spark" style="--d:.42s; --x:-22px; --y:52px"></i>
      <i class="spark" style="--d:.48s; --x:26px;  --y:-28px"></i>
      <i class="spark" style="--d:.54s; --x:-50px; --y:-18px"></i>
      <i class="spark" style="--d:.60s; --x:44px;  --y:16px"></i>
      <i class="spark" style="--d:.66s; --x:-36px; --y:46px"></i>
      <i class="spark" style="--d:.72s; --x:34px;  --y:-50px"></i>
      <i class="spark" style="--d:.78s; --x:-64px; --y:30px"></i>
      <i class="spark" style="--d:.84s; --x:56px;  --y:-12px"></i>
    </div>
  </div>
</main>

<script>
  (function () {
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      document.body.classList.add('done');
    }
    window.addEventListener('pointerdown', finish, { once: true });
    window.addEventListener('keydown', finish, { once: true });
    setTimeout(finish, 4200);
  })();
</script>

</body>
</html>
