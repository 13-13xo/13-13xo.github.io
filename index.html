<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Games</title>
<style>
  :root {
    --bg: #0f1116;
    --card: #171a21;
    --line: #262b36;
    --text: #e8ecf3;
    --muted: #9aa3b2;
    --accent: #7fd1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
  header h1 { font-size: 2.4rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin: 44px 0 14px;
  }
  .games {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .game {
    display: block; padding: 18px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    text-decoration: none; color: var(--text);
    transition: border-color .15s ease, transform .15s ease;
  }
  .game:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game strong { display: block; font-size: 1.05rem; }
  .game span { display: block; color: var(--muted); font-size: 0.9rem; }
  .game .size { display: block; margin-top: 6px; color: #5f6775; font-size: 0.78rem; }
  .empty {
    margin-top: 14px; padding: 22px 24px;
    border: 1px dashed var(--line); border-radius: 14px;
    color: var(--muted); font-size: 0.95rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Our Games</h1>
      <p>Made by us, for us. Pick one and play.</p>
    </header>

    <h2>Games</h2>

    <div class="games">
      <a class="game" href="shoot-the-shit/">
        <strong>Shoot The Shit</strong>
        <span>Ten missions, three sectors. Siege and demolition modes.</span>
        <span class="size">86 MB &middot; give it a moment to load, especially on mobile</span>
      </a>
    </div>
  </div>
</body>
</html>
