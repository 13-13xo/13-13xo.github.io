<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Games</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --seam: 26px;
    --ink: #080a0d;
    --run: 6.6s;      /* weld travel time */
    --t0: 1s;         /* when welding starts */

    --steel-hi:  #f6f9fc;
    --steel-lit: #d7dee6;
    --steel-mid: #a3adb9;
    --steel-dk:  #626c78;
    --steel-deep:#333b44;

    --bronze-hi:  #ffd9a1;
    --bronze-lit: #e7a256;
    --bronze-mid: #bb6c25;
    --bronze-dk:  #7d3f0f;
    --bronze-deep:#3f1f06;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    display: flex;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  .stage::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 6;
    pointer-events: none;
    background:
      radial-gradient(130% 110% at 50% 45%, transparent 48%, rgba(0,0,0,.5) 100%);
  }

  .side {
    position: relative;
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 7vh 6vw;
    overflow: hidden;
    isolation: isolate;
  }

  .side::before {
    content: "";
    position: absolute; inset: 0;
    z-index: -2;
    opacity: .38;
    background-image:
      repeating-linear-gradient(112deg,
        rgba(255,255,255,.22) 0 1px,
        rgba(0,0,0,.12) 1px 2px,
        transparent 2px 6px);
    mix-blend-mode: overlay;
  }

  .side::after {
    content: "";
    position: absolute; inset: -20%;
    z-index: -1;
    background: linear-gradient(78deg,
      transparent 32%,
      rgba(255,255,255,.30) 45%,
      rgba(255,255,255,.06) 52%,
      transparent 62%);
    pointer-events: none;
  }

  .his {
    background:
      radial-gradient(110% 85% at 12% 8%, rgba(255,255,255,.92), transparent 52%),
      radial-gradient(95% 75% at 92% 96%, rgba(255,255,255,.30), transparent 58%),
      linear-gradient(137deg,
        var(--steel-hi) 0%,
        var(--steel-lit) 20%,
        #e9eef3 33%,
        var(--steel-mid) 54%,
        #cfd7df 64%,
        var(--steel-dk) 82%,
        var(--steel-deep) 100%);
    color: #0e1319;
  }

  .her {
    background:
      radial-gradient(110% 85% at 88% 8%, rgba(255,214,155,.85), transparent 52%),
      radial-gradient(95% 75% at 8% 96%, rgba(255,150,60,.40), transparent 58%),
      linear-gradient(137deg,
        var(--bronze-hi) 0%,
        var(--bronze-lit) 20%,
        #f0b878 32%,
        var(--bronze-mid) 52%,
        #d08536 63%,
        var(--bronze-dk) 82%,
        var(--bronze-deep) 100%);
    color: #2a1305;
  }

  .content {
    position: relative;
    max-width: 30ch;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) calc(var(--t0) + var(--run) + .25s) both;
  }

  .her .content { margin-left: auto; text-align: right; }

  h1 {
    margin: 0 0 .55rem;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    font-size: clamp(2.8rem, 7.4vw, 5.8rem);
    line-height: .9;
    letter-spacing: .012em;
    text-transform: uppercase;
  }

  .his h1 {
    color: #151c24;
    text-shadow:
      0 2px 0 rgba(255,255,255,.95),
      0 -1px 0 rgba(0,0,0,.35),
      0 8px 22px rgba(0,0,0,.22);
  }

  .her h1 {
    color: #331704;
    text-shadow:
      0 2px 0 rgba(255,226,183,.9),
      0 -1px 0 rgba(0,0,0,.35),
      0 8px 22px rgba(0,0,0,.25);
  }

  .sub {
    margin: 0 0 2rem;
    font-size: .95rem;
    opacity: .7;
    letter-spacing: .02em;
  }

  .games { display: grid; gap: .8rem; }

  .plate {
    position: relative;
    display: block;
    padding: 1.05rem 1.2rem;
    text-decoration: none;
    color: inherit;
    text-align: left;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.38);
    background: linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.10) 60%, rgba(0,0,0,.10));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -1px 0 rgba(0,0,0,.28),
      0 8px 22px rgba(0,0,0,.28);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .her .plate {
    background: linear-gradient(180deg, rgba(255,238,208,.6), rgba(255,200,140,.18) 60%, rgba(80,36,8,.18));
  }

  .plate:hover, .plate:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(0,0,0,.65);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 14px 30px rgba(0,0,0,.38);
    outline: none;
  }

  .plate::before, .plate::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 7px; height: 7px;
    margin-top: -3.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #8e959e 55%, #3a4047);
    box-shadow: 0 1px 1px rgba(0,0,0,.55);
  }
  .plate::before { left: 7px; }
  .plate::after  { right: 7px; }

  .plate strong {
    display: block;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    font-size: 1.4rem;
    letter-spacing: .035em;
    text-transform: uppercase;
    padding: 0 .95rem;
  }

  .plate span {
    display: block;
    font-size: .84rem;
    opacity: .75;
    padding: 0 .95rem;
  }

  .plate .size { font-size: .74rem; opacity: .55; margin-top: .35rem; }

  .empty {
    padding: 1.15rem 1.2rem;
    border: 1px dashed rgba(0,0,0,.42);
    border-radius: 3px;
    font-size: .88rem;
    opacity: .68;
    letter-spacing: .02em;
  }

  /* ---------- weld seam ---------- */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: var(--seam);
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    animation: seamIn .3s ease-out .95s both;
  }

  .seam::before {
    content: "";
    position: absolute;
    top: -2%; bottom: -2%;
    left: 50%;
    width: 190px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side,
      rgba(255,150,45,.55) 0%,
      rgba(255,110,20,.30) 38%,
      rgba(255,80,0,.12) 62%,
      transparent 78%);
    filter: blur(18px);
    animation: bloom 2.6s ease-out 2.0s both;
  }

  .bead {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    filter: url(#molten) saturate(1.12);
    background:
      repeating-linear-gradient(183deg,
        rgba(255,248,220,.55) 0 1.5px,
        rgba(120,45,5,.30) 1.5px 3px,
        transparent 3px 7px),
      repeating-linear-gradient(-24deg,
        rgba(255,235,200,.16) 0 2px,
        transparent 2px 6px),
      linear-gradient(180deg,
        #ffdfae 0%,
        #ffb768 14%,
        #ff8a2b 34%,
        #e85b0c 50%,
        #a53402 68%,
        #ff9536 86%,
        #ffe4bd 100%);
    box-shadow:
      0 0 10px rgba(255,170,70,.9),
      0 0 26px rgba(255,110,20,.65),
      0 0 60px rgba(255,70,0,.4),
      inset 0 0 10px rgba(90,28,0,.6),
      inset 1px 0 0 rgba(255,245,220,.35),
      inset -1px 0 0 rgba(90,30,0,.45);
    animation: beadSettle 2.4s ease-out calc(var(--t0) + var(--run) - .25s) both;
  }

  /* ---------- TIG torch rig ---------- */
  .rig {
    position: absolute;
    left: 50%;
    top: 0;
    width: 0; height: 0;
    z-index: 7;
    opacity: 0;
    animation: torchRun var(--run) cubic-bezier(.32,.02,.68,.98) var(--t0) both;
    will-change: top, opacity;
  }

  .torch {
    position: absolute;
    left: -60px;
    top: -215px;
    width: 220px;
    height: 260px;
    overflow: visible;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.55));
  }

  .filler {
    transform-box: view-box;
    transform-origin: 232px 110px;
    animation: dip 1.15s ease-in-out infinite;
  }

  .arc {
    position: absolute;
    left: -46px;
    top: -46px;
    width: 92px; height: 92px;
    border-radius: 50%;
    background: radial-gradient(circle,
      #fff 0%,
      #fffdf2 10%,
      #ffe6a8 22%,
      #ffc061 36%,
      rgba(255,120,20,.55) 54%,
      transparent 72%);
    filter: blur(.6px);
    animation: flicker .11s steps(2, end) infinite;
  }

  .puddle {
    position: absolute;
    left: -14px; top: -6px;
    width: 28px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(closest-side, #fffdf0, #ffbe63 55%, rgba(255,110,10,0) 100%);
    filter: blur(2px);
  }

  .sparks { position: absolute; left: 0; top: 0; }

  .spark {
    position: absolute;
    left: 0; top: 0;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff6d2;
    box-shadow: 0 0 7px 2px rgba(255,170,60,.95);
    opacity: 0;
    animation: sparkFly .55s ease-out infinite;
    animation-delay: var(--d);
  }

  /* ---------- keyframes ---------- */
  @keyframes slideFromLeft  { from { transform: translateX(-102%); } to { transform: none; } }
  @keyframes slideFromRight { from { transform: translateX(102%);  } to { transform: none; } }
  @keyframes slideFromTop   { from { transform: translateY(-102%); } to { transform: none; } }
  @keyframes slideFromBottom{ from { transform: translateY(102%);  } to { transform: none; } }

  .his { animation: slideFromLeft  .95s cubic-bezier(.16,.84,.24,1) both; }
  .her { animation: slideFromRight .95s cubic-bezier(.16,.84,.24,1) both; }

  @keyframes seamIn { from { opacity: 0; } to { opacity: 1; } }

  @keyframes torchRun {
    0%   { top: -110px;          opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { top: calc(100% + 70px); opacity: 0; }
  }

  @keyframes dip {
    0%   { transform: rotate(0deg); }
    45%  { transform: rotate(-3.4deg); }
    60%  { transform: rotate(-3.4deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes flicker {
    0%   { opacity: .82; transform: scale(.96); }
    100% { opacity: 1;   transform: scale(1.04); }
  }

  @keyframes bloom {
    0%   { opacity: .25; filter: blur(10px); }
    30%  { opacity: 1;   filter: blur(22px); }
    100% { opacity: .55; filter: blur(18px); }
  }

  @keyframes sparkFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.25); }
  }

  @keyframes beadSettle {
    0%   { filter: url(#molten) brightness(2.4) saturate(1.5); }
    100% { filter: url(#molten) brightness(1) saturate(1.12); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- skip / reduced motion ---------- */
  body.done .side,
  body.done .seam,
  body.done .seam::before,
  body.done .bead,
  body.done .rig,
  body.done .content { animation: none !important; }

  body.done .rig { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .side, .seam, .seam::before, .bead, .rig, .content { animation: none !important; }
    .rig { display: none; }
  }

  /* ---------- mobile: stack, horizontal seam ---------- */
  @media (max-width: 820px) {
    .stage { flex-direction: column; }

    .side { padding: 5.5vh 7vw; justify-content: center; }
    .content { max-width: none; }
    .her .content { margin-left: 0; text-align: left; }
    h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); }

    .seam {
      top: 50%; bottom: auto;
      left: 0; right: 0;
      width: auto;
      height: var(--seam);
      transform: translateY(-50%);
    }

    .seam::before {
      top: 50%; bottom: auto;
      left: -2%; right: -2%;
      width: auto;
      height: 150px;
      transform: translateY(-50%);
    }

    .bead {
      background:
        repeating-linear-gradient(93deg,
          rgba(255,248,220,.55) 0 1.5px,
          rgba(120,45,5,.30) 1.5px 3px,
          transparent 3px 7px),
        repeating-linear-gradient(-24deg,
          rgba(255,235,200,.16) 0 2px,
          transparent 2px 6px),
        linear-gradient(90deg,
          #ffdfae 0%, #ffb768 14%, #ff8a2b 34%,
          #e85b0c 50%, #a53402 68%, #ff9536 86%, #ffe4bd 100%);
    }

    /* the torch rides across instead of down */
    .rig {
      left: -110px;
      top: 50%;
      animation-name: torchRunH;
    }

    .his { animation-name: slideFromTop; }
    .her { animation-name: slideFromBottom; }
  }

  @keyframes torchRunH {
    0%   { left: -110px;          opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { left: calc(100% + 70px); opacity: 0; }
  }
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <filter id="molten">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.11" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

  </defs>
</svg>

<main class="stage">
  <section class="side his" aria-labelledby="his-title">
    <div class="content">
      <h1 id="his-title">His Games</h1>
      <p class="sub">Cold-rolled, riveted, ready to fire.</p>

      <div class="games">
        <div class="empty">Nothing welded in yet.</div>
      </div>
    </div>
  </section>

  <section class="side her" aria-labelledby="her-title">
    <div class="content">
      <h1 id="her-title">Her Games</h1>
      <p class="sub">Cast, polished, still cooling.</p>

      <div class="games">
        <a class="plate" href="shoot-the-shit/">
          <strong>Shoot The Shit</strong>
          <span>Ten missions, three sectors. Siege and demolition.</span>
          <span class="size">86 MB &middot; give it a moment to load</span>
        </a>
      </div>
    </div>
  </section>

  <div class="seam" aria-hidden="true">
    <div class="bead"></div>

    <div class="rig">
      <div class="arc"></div>
      <div class="puddle"></div>

      <svg class="torch" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#f4ece0"/>
            <stop offset=".35" stop-color="#fffdf8"/>
            <stop offset=".7"  stop-color="#e6dccd"/>
            <stop offset="1"   stop-color="#c9bfae"/>
          </linearGradient>
          <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#8a4a1b"/>
            <stop offset=".3"  stop-color="#d99a4e"/>
            <stop offset=".55" stop-color="#f3c07a"/>
            <stop offset=".8"  stop-color="#c07a34"/>
            <stop offset="1"   stop-color="#7a3f14"/>
          </linearGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#20262d"/>
            <stop offset=".22" stop-color="#5a6673"/>
            <stop offset=".42" stop-color="#39424c"/>
            <stop offset=".75" stop-color="#1b2026"/>
            <stop offset="1"   stop-color="#0d1115"/>
          </linearGradient>
          <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#15191e"/>
            <stop offset=".28" stop-color="#3d464f"/>
            <stop offset=".46" stop-color="#242b33"/>
            <stop offset=".8"  stop-color="#12161a"/>
            <stop offset="1"   stop-color="#080a0d"/>
          </linearGradient>
          <linearGradient id="rodGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#8d97a2"/>
            <stop offset=".45" stop-color="#eef3f8"/>
            <stop offset=".7"  stop-color="#b9c2cb"/>
            <stop offset="1"   stop-color="#6f7883"/>
          </linearGradient>
          <linearGradient id="hoseGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#0b0e11"/>
            <stop offset=".4"  stop-color="#2b3239"/>
            <stop offset=".7"  stop-color="#14181d"/>
            <stop offset="1"   stop-color="#07090b"/>
          </linearGradient>
        </defs>

        <!-- gas hose trailing away -->
        <path d="M62 46 C 92 -4 152 8 208 44"
              stroke="url(#hoseGrad)" stroke-width="12" stroke-linecap="round"/>
        <path d="M62 46 C 92 -4 152 8 208 44"
              stroke="#454e57" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
        <path d="M64 58 C 96 14 150 22 202 54"
              stroke="#0a0d10" stroke-width="4.5" stroke-linecap="round" opacity=".9"/>

        <!-- handle -->
        <rect x="40" y="44" width="42" height="74" rx="13" fill="url(#handleGrad)"/>
        <rect x="46" y="52" width="7" height="56" rx="3.5" fill="#9aa5b0" opacity=".18"/>
        <rect x="66" y="52" width="3" height="56" rx="1.5" fill="#000" opacity=".35"/>

        <!-- barrel / torch body -->
        <rect x="46" y="112" width="30" height="34" rx="4" fill="url(#bodyGrad)"/>
        <rect x="49" y="116" width="4" height="26" rx="2" fill="#aab5c0" opacity=".22"/>

        <!-- copper collet body -->
        <rect x="41" y="142" width="40" height="17" rx="3" fill="url(#copperGrad)"/>
        <rect x="41" y="146" width="40" height="2" fill="#ffe0b0" opacity=".45"/>

        <!-- ceramic cup (alumina nozzle) -->
        <path d="M35 157 L87 157 L73 212 L49 212 Z" fill="url(#cupGrad)"/>
        <path d="M35 157 L87 157 L84 164 L38 164 Z" fill="#fff" opacity=".35"/>
        <ellipse cx="61" cy="212" rx="12" ry="4.2" fill="#6d6355"/>
        <ellipse cx="61" cy="212" rx="8" ry="2.6" fill="#241d16"/>

        <!-- tungsten electrode -->
        <line x1="61" y1="210" x2="61" y2="231" stroke="#cfd7e0" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="61" y1="226" x2="61" y2="231" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>

        <!-- filler rod, feeding into the puddle -->
        <g class="filler">
          <line x1="232" y1="110" x2="78" y2="205"
                stroke="url(#rodGrad)" stroke-width="5" stroke-linecap="round"/>
          <line x1="227" y1="105" x2="92" y2="190"
                stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
          <circle cx="78" cy="205" r="3.4" fill="#fff3cf" opacity=".85"/>
        </g>
      </svg>

      <div class="sparks">
        <i class="spark" style="--d:0s;    --x:-46px; --y:38px"></i>
        <i class="spark" style="--d:.07s;  --x:52px;  --y:26px"></i>
        <i class="spark" style="--d:.14s;  --x:-30px; --y:-34px"></i>
        <i class="spark" style="--d:.21s;  --x:38px;  --y:-42px"></i>
        <i class="spark" style="--d:.28s;  --x:-58px; --y:12px"></i>
        <i class="spark" style="--d:.35s;  --x:60px;  --y:44px"></i>
        <i class="spark" style="--d:.42s;  --x:-22px; --y:52px"></i>
        <i class="spark" style="--d:.49s;  --x:26px;  --y:-28px"></i>
      </div>
    </div>
  </div>
</main>

<script>
  (function () {
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      document.body.classList.add('done');
    }
    window.addEventListener('pointerdown', finish, { once: true });
    window.addEventListener('keydown', finish, { once: true });
    setTimeout(finish, 9400);
  })();
</script>

</body>
</html>
