<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Our Games">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset=".28"  stop-color="#e4ebf2"/>
      <stop offset=".55"  stop-color="#b7c1cc"/>
      <stop offset=".78"  stop-color="#7d8894"/>
      <stop offset="1"    stop-color="#454f5a"/>
    </linearGradient>

    <linearGradient id="bronze" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffe0b0"/>
      <stop offset=".28"  stop-color="#f0b26a"/>
      <stop offset=".55"  stop-color="#c9832f"/>
      <stop offset=".78"  stop-color="#965012"/>
      <stop offset="1"    stop-color="#552606"/>
    </linearGradient>

    <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff2d4"/>
      <stop offset=".35" stop-color="#ffb459"/>
      <stop offset=".7"  stop-color="#f2701a"/>
      <stop offset="1"   stop-color="#a83406"/>
    </linearGradient>

    <clipPath id="leftHalf"><rect x="-2" y="0" width="34" height="64"/></clipPath>
    <clipPath id="rightHalf"><rect x="32" y="0" width="34" height="64"/></clipPath>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark bed so light edges stay readable on any tab colour -->
  <path d="M32 57.4 C 7.2 39 2.6 27.2 2.6 19.6 C 2.6 10.4 9.9 4.6 17.4 4.6 C 23.9 4.6 29 8.4 32 12.6 C 35 8.4 40.1 4.6 46.6 4.6 C 54.1 4.6 61.4 10.4 61.4 19.6 C 61.4 27.2 56.8 39 32 57.4 Z"
        fill="#12161a" opacity=".92"/>

  <g clip-path="url(#leftHalf)">
    <path d="M32 55.6 C 8.6 38.4 4.4 27.2 4.4 19.8 C 4.4 11.4 11.2 6.2 18.2 6.2 C 24.3 6.2 29.2 9.7 32 13.6 C 34.8 9.7 39.7 6.2 45.8 6.2 C 52.8 6.2 59.6 11.4 59.6 19.8 C 59.6 27.2 55.4 38.4 32 55.6 Z"
          fill="url(#steel)"/>
    <!-- brushed highlight on the silver side -->
    <path d="M14 13.6 C 20 9.6 27 10.4 31.6 15.4" fill="none" stroke="#ffffff" stroke-width="2.4"
          stroke-linecap="round" opacity=".55"/>
  </g>

  <g clip-path="url(#rightHalf)">
    <path d="M32 55.6 C 8.6 38.4 4.4 27.2 4.4 19.8 C 4.4 11.4 11.2 6.2 18.2 6.2 C 24.3 6.2 29.2 9.7 32 13.6 C 34.8 9.7 39.7 6.2 45.8 6.2 C 52.8 6.2 59.6 11.4 59.6 19.8 C 59.6 27.2 55.4 38.4 32 55.6 Z"
          fill="url(#bronze)"/>
    <!-- cast highlight on the bronze side -->
    <path d="M50 13.6 C 44.4 9.8 38 10.6 33.2 15" fill="none" stroke="#ffe8c2" stroke-width="2.4"
          stroke-linecap="round" opacity=".45"/>
  </g>

  <!-- the fused seam -->
  <g filter="url(#glow)">
    <path d="M32 12.4 L32 54.4" stroke="url(#bead)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M32 12.9 L32 53.9" stroke="#fff8e8" stroke-width="1.1" stroke-linecap="round"
          stroke-dasharray="2.2 2" opacity=".8"/>
  </g>

  <!-- rim -->
  <path d="M32 55.6 C 8.6 38.4 4.4 27.2 4.4 19.8 C 4.4 11.4 11.2 6.2 18.2 6.2 C 24.3 6.2 29.2 9.7 32 13.6 C 34.8 9.7 39.7 6.2 45.8 6.2 C 52.8 6.2 59.6 11.4 59.6 19.8 C 59.6 27.2 55.4 38.4 32 55.6 Z"
        fill="none" stroke="#0a0d10" stroke-width="1.5" opacity=".55"/>
</svg>
